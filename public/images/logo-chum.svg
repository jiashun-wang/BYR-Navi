<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">垃圾桶学术导航</title>
  <desc id="desc">一本打开的书作为垃圾桶的盖子，旁边垂着金色书签</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="450" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#0A2A6B"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="4"/>

  <!-- bookmark ribbon, tucked between the pages -->
  <path d="M352 150h26v170l-13-15-13 15z" fill="#FFC94A"/>

  <!-- open book / lid -->
  <path d="M256 130c-42-20-88-18-128 4v62c42-14 86-8 128 10z" fill="#FFFFFF"/>
  <path d="M256 130c42-20 88-18 128 4v62c-42-14-86-8-128 10z" fill="#FFFFFF"/>
  <path d="M256 140v62" stroke="#0C2A56" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M148 154c30 6 58 18 84 32" fill="none" stroke="#38D6FF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M364 154c-30 6-58 18-84 32" fill="none" stroke="#38D6FF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- can rim -->
  <rect x="150" y="214" width="212" height="30" rx="15" fill="#FFFFFF"/>

  <!-- can body -->
  <path d="M164 244h184l-16 164c-2 20-17 32-36 32h-80c-19 0-34-12-36-32z" fill="#FFFFFF"/>

  <!-- slots -->
  <rect x="210" y="288" width="20" height="102" rx="10" fill="#0C2A56"/>
  <rect x="246" y="288" width="20" height="102" rx="10" fill="#0C2A56"/>
  <rect x="282" y="288" width="20" height="102" rx="10" fill="#0C2A56"/>
</svg>
